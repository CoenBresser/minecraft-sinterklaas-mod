name: ci

on:
  # ready_for_review is what triggers the game test below for a PR opened as draft:
  # the default types (opened, synchronize, reopened) don't include it on their own.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Called by the release workflow on every push to main.
  workflow_call:

# The mod is built for two Minecraft versions, each with its own toolchain:
#   forge-26.3/    Minecraft 26.3,   Forge 66.1.8,  ForgeGradle 7, Gradle 9, Java 25 (root build)
#   forge-1.20.1/  Minecraft 1.20.1, Forge 47.4.10, ForgeGradle 6, Gradle 8, Java 17 (its own build)

jobs:
  # Builds both mod jars and runs the unit tests of the game rules in core/
  # (4 and 5 December, time zone, season, shoe).
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Minecraft 26.3 needs Java 25. ForgeGradle 7 also runs one of its tools on Java 8.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build 26.3 and unit tests
        run: ./gradlew build

      # Minecraft 1.20.1 needs Java 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build 1.20.1
        working-directory: forge-1.20.1
        run: ./gradlew build

      - name: Upload the mod jars
        uses: actions/upload-artifact@v4
        with:
          name: sinterklaas-mod-jars
          path: |
            forge-26.3/build/libs/*.jar
            forge-1.20.1/build/libs/*.jar
          retention-days: 7

  # Starts a real Forge game test server for each Minecraft version and plays through
  # the rules (SpelTest.java in each module). Runs after `verify` so a compile or unit
  # test failure fails fast without first paying for two server starts.
  #
  # Skipped while a PR is still a draft, and on release-please's PR: that one only
  # touches CHANGELOG.md, gradle.properties and the manifest, on top of a main whose
  # code already passed here.
  speltest:
    needs: verify
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.draft == false &&
      !startsWith(github.head_ref, 'release-please--'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: |
            8
            25

      - uses: gradle/actions/setup-gradle@v4

      - name: Game tests 26.3
        run: ./gradlew :forge-26.3:runGameTestServer

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Game tests 1.20.1
        working-directory: forge-1.20.1
        run: ./gradlew runGameTestServer
