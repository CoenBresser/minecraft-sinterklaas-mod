name: ci

on:
  # ready_for_review is what triggers the game test below for a PR opened as draft:
  # the default types (opened, synchronize, reopened) don't include it on their own.
  pull_request:
    types: [opened, synchronize, reopened, ready_for_review]
  # Called by the release workflow on every push to main.
  workflow_call:

# The mod is built for the two setups the server runs, each with its own toolchain:
#   fabric/        Minecraft 26.2,   Fabric,        Loom,          Gradle 9, Java 25 (root build)
#   forge-1.20.1/  Minecraft 1.20.1, Forge 47.4.10, ForgeGradle 6, Gradle 8, Java 17 (its own build)

jobs:
  # Builds both mod jars, runs the unit tests of the game rules in core/
  # (4 and 5 December, time zone, season, shoe) and packs the CurseForge modpacks.
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Minecraft 26.2 needs Java 25.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      # The generated assets (models, pictures, recipes, loot tables) must match what
      # tools/maak_assets.py makes. Otherwise the build and tests can pass while the next run of
      # the script silently changes them. Pictures are compared by pixels, not bytes.
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Check the generated assets
        run: |
          pip install pillow==12.3.0
          python3 tools/maak_assets.py
          python3 tools/controleer_assets.py

      - name: Build Fabric 26.2 and unit tests
        run: ./gradlew build

      # Minecraft 1.20.1 needs Java 17.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build Forge 1.20.1
        working-directory: forge-1.20.1
        run: ./gradlew build

      # One importable zip per version for the CurseForge app (tools/maak_modpacks.py).
      - name: Pack the modpacks
        run: python3 tools/maak_modpacks.py

      - name: Upload the modpacks and mod jars
        uses: actions/upload-artifact@v4
        with:
          name: sinterklaas-mod
          path: |
            build/modpacks/*.zip
            fabric/build/libs/*.jar
            forge-1.20.1/build/libs/*.jar
          retention-days: 7

  # Plays through the rules in the real game. Fabric: a real Minecraft client on a
  # virtual screen (fabric/src/gametest), with screenshots. Forge 1.20.1: a game test
  # server (forge-1.20.1/src/gametest). Runs after `verify` so a compile or unit test
  # failure fails fast without first paying for a full client start.
  #
  # Skipped while a PR is still a draft, and on release-please's PR: that one only
  # touches CHANGELOG.md, gradle.properties and the manifest, on top of a main whose
  # code already passed here.
  speltest:
    needs: verify
    if: >-
      github.event_name != 'pull_request' ||
      (github.event.pull_request.draft == false &&
      !startsWith(github.head_ref, 'release-please--'))
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      # The runner has no graphics card: Mesa renders in software.
      - name: Client game test (Fabric 26.2)
        run: xvfb-run -a --server-args="-screen 0 1280x720x24" ./gradlew :fabric:runClientGameTest
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: speltest-screenshots
          path: fabric/build/run/clientGameTest/screenshots/
          retention-days: 7
          if-no-files-found: ignore

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Game tests (Forge 1.20.1)
        working-directory: forge-1.20.1
        run: ./gradlew runGameTestServer
