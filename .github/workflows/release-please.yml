name: release-please

on:
  push:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  # main is always built and tested again here. A build takes a few minutes, so unlike
  # formation-creator there is no shortcut that skips CI when the PR already passed.
  ci:
    uses: ./.github/workflows/ci.yml

  # Gate: no release PR is opened or tagged unless main is tested.
  release-please:
    needs: ci
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
    steps:
      - uses: googleapis/release-please-action@v4
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          config-file: .github/release-please/config.json
          manifest-file: .github/release-please/manifest.json

  # A merged release PR is a release: build both versions at that tag and attach the modpacks and jars to the
  # GitHub release, so players can download them without building.
  publiceer:
    needs: release-please
    if: needs.release-please.outputs.release_created == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 25

      - uses: gradle/actions/setup-gradle@v4

      - name: Build the Fabric 26.2 jar
        run: ./gradlew build

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Build the Forge 1.20.1 jar
        working-directory: forge-1.20.1
        run: ./gradlew build

      - name: Pack the modpacks
        run: python3 tools/maak_modpacks.py

      # The modpacks are what players import in the CurseForge app; the loose jars are
      # for an existing profile and for the server, which downloads them by URL.
      - name: Attach the modpacks and jars to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: >-
          gh release upload "${{ needs.release-please.outputs.tag_name }}"
          build/modpacks/*.zip fabric/build/libs/*.jar forge-1.20.1/build/libs/*.jar --clobber
