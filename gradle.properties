org.gradle.jvmargs=-Xmx2G

# De versie van de mod. Niet met de hand aanpassen: release-please werkt dit bij in de release-PR.
# x-release-please-start-version
mod_version=0.8.0
# x-release-please-end

# Minecraft 26.2 op Fabric: dezelfde versie als de server. De versie voor 1.20.1 (Forge) staat in
# forge-1.20.1/gradle.properties.
minecraft_version=26.2
# De Fabric Loader waartegen gebouwd wordt, en de oudste waarmee de mod werkt: de nieuwste die de
# CurseForge-app aanbiedt. Niet verhogen zolang CurseForge geen nieuwere heeft.
loader_version=0.19.5
loom_version=1.19.4
fabric_api_version=0.161.0+26.2
# Hetzelfde bestand van Fabric API op CurseForge: het getal achter /files/ in
# https://www.curseforge.com/minecraft/mc-mods/fabric-api/files/<getal>. Het modpack verwijst hiernaar,
# zodat de CurseForge-app Fabric API zelf downloadt en in de lijst Mods toont. Verander het samen met
# fabric_api_version, anders krijgen spelers een andere Fabric API dan waartegen gebouwd is.
fabric_api_curseforge_file=8913446
