org.gradle.jvmargs=-Xmx2G

# De versie van de mod. Niet met de hand aanpassen: release-please werkt dit bij in de release-PR.
# x-release-please-start-version
mod_version=0.6.0
# x-release-please-end

# Minecraft 26.3 op Forge. De versie voor 1.20.1 staat in forge-1.20.1/gradle.properties.
minecraft_version=26.3
forge_version=66.1.8

# ForgeGradle: klassen en resources samen in één map, zodat Forge de mod bij het draaien als één geheel ziet.
net.minecraftforge.gradle.merge-source-sets=true
