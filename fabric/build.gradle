plugins {
	id 'net.fabricmc.fabric-loom' version "${loom_version}"
}
group = 'nl.sinterklaas'
version = "${project.mod_version}+mc${project.minecraft_version}"
base { archivesName = 'sinterklaas-fabric' }

loom {
	splitEnvironmentSourceSets()
	mods {
		"sinterklaas" {
			sourceSet sourceSets.main
			sourceSet sourceSets.client
		}
	}
}

dependencies {
	minecraft "com.mojang:minecraft:${project.minecraft_version}"
	implementation "net.fabricmc:fabric-loader:${project.loader_version}"
	implementation "net.fabricmc.fabric-api:fabric-api:${project.fabric_api_version}"

	// De spelregels-laag wordt in de mod-jar meegeleverd (jar-in-jar).
	implementation project(':core')
	include project(':core')
}

processResources {
	def v = project.version
	inputs.property "version", v
	filesMatching("fabric.mod.json") { expand "version": v }
}

tasks.withType(JavaCompile).configureEach { it.options.release = 25 }

jar { from(rootProject.file('LICENSE')) }

// De bronplaatjes in ./textures blijven de enige waarheid: een plaatje vervangen = opnieuw bouwen.
processResources {
	from(rootProject.file('textures')) {
		include 'piet_roetveeg.png', 'piet_hoofd.png', 'piet_pakjes.png', 'piet_wegwijs.png', 'piet_koek.png', 'piet_malle.png'
		rename 'piet_(.*)\\.png', '$1.png'
		into 'assets/sinterklaas/textures/entity/piet'
	}
	from(rootProject.file('textures')) {
		include 'sint.png'
		into 'assets/sinterklaas/textures/entity'
	}
	from(rootProject.file('textures')) {
		include 'model_*.png'
		rename 'model_(.*)\\.png', '$1.png'
		into 'assets/sinterklaas/textures/block'
	}
}

// Automatische proef in een echte client: ./gradlew :fabric:runClientGameTest
fabricApi {
	configureTests {
		createSourceSet = true
		modId = "sinterklaas-test"
		enableGameTests = false
		enableClientGameTests = true
		eula = true
	}
}
